<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDD130 | Daniel Florian | Html Form - User Poll</title>
    <meta name="description" content="Html Form - User Poll">
    <meta name="author" content="Daniel Florian">
</head> 
<body>
    <header>
        <h1> HDD130 | Daniel Florian | Html Form - User Poll</h1>
       
    </header>
    <nav>
         
    </nav>

    <main>
      <form>
        <fieldset>
            <legend>Contact Information</legend>
            <label for="fullname" >Full Name</label>  
            <input type="text" id="fullname" name="fullname">
            <label for="useremail" >Email:</label>  
            <input type="email" id="useremail" name="useremail">
            
        </fieldset>
        <fieldset>
            <legend>Questions</legend>
            <label for="browser" >What is your favorite internet browser?</label>  
            <select id="browser" name="browser">
                <option value="chrome">chrome</option>
                <option value="firefox">Firefox</option>
                <option value="safari">Safari</option>
                <option value="edge">Edge</option>
                <option value="brave">Brave</option>
                <option value="other">Other</option>
            </select>
            <label for="pet">Do you have a household pet?</label> 
            <input type="checkbox" id="pet" name="pet">
            <label for="feedback">List the places you have lived:</label> 
            <textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Tibuktu Mali"></textarea>

           
        </fieldset>
        <button type="submit" >Submit Poll</button>

      </form>
    </main>
    
    <footer>
        <p> © 2025 | Html Form - User Poll Activity | Daniel Florian </p>
    </footer>

    
</body>
</html>
