<body>
    <header class="my_grid">
        <div class="logo-box">
            <img src="images/LogoRafting.jpg" alt="Rafting Logo" width="160">
        </div>
        <div></div>
        <nav class="my_nav">
            <a href="index.html">Home</a>

        </nav>
    </header>
    <main>
        <div class="title">
            
            <h1 >Contact with Peru Rafting company</h1>
    
        </div>

        
        <section>
            <div class="contact">
                <div class="info">
                   <h3>Contact information</h3>
                   <p><b>Address:</b> Mz f9 Lt 9 Coop. Sol de Cieneguilla, Lima.</p>
                   <p><b>Phone:</b> 51 995 841 975</p>
                   <p><b>E-mail:</b> cardafma@gmail.com</p>



                </div>
                <div class="contactform">
                    <h3>Contact form</h3>
                    <form>
                       
                            <div class="form_item">
                                <label for="fullname" >Full Name: </label>  
                                <input type="text" id="fullname" name="fullname">
                            </div>
                            <div class="form_item">
                                <label for="phone" >Phone: </label>  
                                <input type="text" id="phone" name="phone">
                            </div> 
                            <div class="form_item">
                                <label for="useremail" >Email: </label>  
                                <input type="email" id="useremail" name="useremail">
                            </div> 
                            <div class="form_item">
                                <label >Your purpose: </label>  
                                <div class="specialradio" id="specialradio">
                                    
                                    <label>
                                        <input type="radio" name="specialradio"  value="option1">
                                        General Inquiry
                                    </label>
                                
                                    <label>
                                        <input type="radio" name="specialradio" value="option2">
                                        Reservation Question
                                    </label>
                                
                                    <label>
                                        <input type="radio" name="specialradio" value="option3">
                                        Website Suggestion
                                    </label>

                                </div>
                            </div>
                            <div class="form_item">
                                <label for="feedback" >Message:</label> 
                                <textarea id="feedback" name="feedback" rows="4" placeholder="Your message"></textarea>
                            </div>
                           
                           

                            <div class="form_item">
                                <label ></label> 
                                <button type="submit" >Submit Poll</button>
                            </div>

                            <div class="form_item_n">
                                <label for="nl">Please subscribe me to the monthly newsletter:</label> 
                                <input type="checkbox" id="nl" name="nl" checked >
                            </div>
                           
                        
                        
                
                      </form>



                </div>
               

            </div>
                
         
        </section>
        <div class="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2319.7224474942236!2d-77.02496260870291!3d-12.09211156468363!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9105c90070cc1eef%3A0xd288e59223c3d9d9!2snm%20lima!5e0!3m2!1ses!2spe!4v1739042906486!5m2!1ses!2spe" width="1000" height="450"  allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
           
            
        </div>

        <section>
            <div class="emptitle">
                <h1>Happy employees</h1>
            </div>
            <div class="emp">
                <figure>
                    <img src="images/emp_1.jpg" alt="Giorgina">
                    <figcaption>Hello</figcaption>
                </figure>
                <figure>
                    <img src="images/emp_2.jpg" alt="Arturo">
                    <figcaption>Hello</figcaption>
                </figure>
                <figure>
                    <img src="images/emp_3.jpg" alt="Louis">
                    <figcaption>Hello</figcaption>
                </figure>
            </div>
        </section>
